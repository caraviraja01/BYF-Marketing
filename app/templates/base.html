<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}BYF Marketing{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="logo">BYF</span>
      <span>{{ brand.name }} · Marketing Automation</span>
    </a>
    <nav>
      <a href="/">Dashboard</a>
      {% if llm_enabled %}
        <span class="badge live">● Live (Claude)</span>
      {% else %}
        <span class="badge mock" title="Set ANTHROPIC_API_KEY to enable real generation">● Mock mode</span>
      {% endif %}
      {% if auth_enabled %}
        <form method="post" action="/logout" class="logout-form"><button type="submit" class="btn">Log out</button></form>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    Educational content workflow · Human approval required before publishing.
  </footer>
  <script>
    // Lightweight tabs: <div class="tabs"> with .tab buttons (data-target) + .tab-panel by id.
    document.querySelectorAll('.tabs').forEach(function (group) {
      var tabs = group.querySelectorAll('.tab');
      var panels = group.querySelectorAll('.tab-panel');
      function activate(id) {
        tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.target === id); });
        panels.forEach(function (p) { p.classList.toggle('active', p.id === id); });
      }
      tabs.forEach(function (t) {
        t.addEventListener('click', function () {
          activate(t.dataset.target);
          history.replaceState(null, '', '#' + t.dataset.target);
        });
      });
      var hash = (location.hash || '').replace('#', '');
      var has = Array.prototype.some.call(panels, function (p) { return p.id === hash; });
      activate(has ? hash : (tabs[0] && tabs[0].dataset.target));
    });
  </script>
</body>
</html>
