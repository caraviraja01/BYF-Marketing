# Render deployment blueprint for the BYF marketing dashboard.
# Docs: https://render.com/docs/blueprint-spec
#
# How to deploy:
#   1. Push this repo to GitHub (already done).
#   2. In Render → New → Blueprint → connect this repo and pick this branch.
#   3. Render reads this file and creates the web service.
#   4. Set the ANTHROPIC_API_KEY secret when prompted (it is NOT stored here).
#   5. Open the generated *.onrender.com URL.
#
# Run history is stored in a free Render Postgres (below) so it persists across
# restarts/redeploys — the free instance's filesystem is otherwise ephemeral.

databases:
  - name: byf-db
    plan: free
    databaseName: byf
    user: byf

services:
  - type: web
    name: byf-marketing
    runtime: python
    plan: free
    branch: claude/relaxed-einstein-wern1x
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Secret — leave blank here; set the real value in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Dashboard login — set a strong password in the dashboard to protect the URL.
      - key: BYF_AUTH_USERNAME
        value: admin
      - key: BYF_AUTH_PASSWORD
        sync: false
      # Session cookie signing key — Render can auto-generate a secure value.
      - key: BYF_SECRET_KEY
        generateValue: true
      # Token for the daily content-prep cron endpoint (/tasks/prepare-daily).
      - key: BYF_CRON_TOKEN
        generateValue: true
      - key: BYF_MODEL
        value: claude-sonnet-4-6
      - key: BYF_FAST_MODEL
        value: claude-haiku-4-5-20251001
      # Speed: fewer options + faster model for script/creative. Flip to "true"/
      # lower the count in the dashboard if cycles feel slow.
      - key: BYF_VARIANTS
        value: "3"
      - key: BYF_FAST_CONTENT
        value: "false"
      # Persistent history — connection string from the Postgres above.
      - key: BYF_DB_URL
        fromDatabase:
          name: byf-db
          property: connectionString
      - key: BYF_ENV
        value: production
      # Simulate publishing until real social credentials are added.
      - key: BYF_SIMULATE_PUBLISH
        value: "true"
      # Keep the dashboard populated even if a live agent call fails.
      - key: BYF_FALLBACK_TO_MOCK_ON_ERROR
        value: "true"
      # Higgsfield image + video generation — REQUIRED for creatives.
      # Set both in the dashboard. Auth is "Key <id>:<secret>"; if you only have
      # one token, put it in HIGGSFIELD_API_KEY (and leave SECRET blank).
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HIGGSFIELD_SECRET
        sync: false
